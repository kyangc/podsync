services:
  media:
    image: nginx:1.30.4-alpine
    restart: always
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx-media.conf:/etc/nginx/nginx.conf:ro
      - ./data/.remote-media:/srv/podsync:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  media-tunnel:
    image: cloudflare/cloudflared:2026.7.3
    restart: always
    init: true
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    volumes:
      - ./.secrets/media-tunnel-token:/run/secrets/tunnel-token:ro
    depends_on:
      media:
        condition: service_healthy
