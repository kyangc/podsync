services:
  podsync:
    environment:
      PYTHONPATH: /opt/podsync/yt-dlp-plugins/bgutil-ytdlp-pot-provider.zip
    networks:
      - default
      - bgutil-provider
    depends_on:
      bgutil-provider:
        condition: service_healthy

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno@sha256:addc137188b8f2be54b17bb0a919a3847cd417d143162e74d2fe9b410e586bcd
    restart: always
    init: true
    logging:
      driver: none
    expose:
      - "4416"
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - 'const response = await fetch("http://127.0.0.1:4416/ping"); if (!response.ok) Deno.exit(1)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - bgutil-provider

networks:
  bgutil-provider:
    driver: bridge
