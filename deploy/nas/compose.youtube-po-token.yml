services:
  podsync:
    environment:
      PYTHONPATH: /opt/podsync/yt-dlp-plugins/bgutil-ytdlp-pot-provider.zip
    depends_on:
      bgutil-provider:
        condition: service_healthy

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno@sha256:bea3cfda79245700d7ad90500052b4358b1c1828fdc0961929624b83933121bc
    restart: always
    init: true
    logging:
      driver: none
    expose:
      - "4416"
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - 'const response = await fetch("http://127.0.0.1:4416/ping"); if (!response.ok) Deno.exit(1)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
