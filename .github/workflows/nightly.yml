name: Nightly

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag for a manual build
        required: false
        default: nightly
        type: string
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'nightly' }}

jobs:
  publish:
    name: Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 🧪 Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false

      - name: 🧪 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔒 Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔎 Validate image tag
        run: |
          case "${IMAGE_TAG}" in
            ""|*[!A-Za-z0-9_.-]*) echo "invalid image tag" >&2; exit 1 ;;
          esac

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v7
        with:
          build-args: |
            TAG=${{ env.IMAGE_TAG }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: 🩺 Smoke test pushed image
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --pull always --platform "${platform}" --entrypoint /bin/sh "${image}" -c '
              set -eu
              test -s /app/podsync
              /app/podsync --help >/tmp/podsync-help.txt 2>&1 || true
              grep -q "Usage:" /tmp/podsync-help.txt
              /usr/local/bin/youtube-dl --version >/dev/null

              plugin=/opt/podsync/yt-dlp-plugins/bgutil-ytdlp-pot-provider.zip
              test -s "${plugin}"
              echo "b8ceec7f76143da172aaf5ebeec0c2d218e5680c063b931586bca48567069b38  ${plugin}" | sha256sum -c -
              PYTHONPATH="/usr/local/bin/youtube-dl:${plugin}" python3 -c "from yt_dlp_plugins.extractor.getpot_bgutil_http import BgUtilHTTPPTP; print(BgUtilHTTPPTP.PROVIDER_VERSION)" | grep -qx "1.3.1"
              test -s /usr/share/doc/podsync/THIRD_PARTY_NOTICES.md
            '
          done
